name: shop_app_local_db
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: 9.0.0
  flutter_bloc: 9.1.1
  go_router: 16.0.0
  carousel_slider: 5.1.1
  smooth_page_indicator: 1.2.1
  animations: 2.0.11
  overlay_support: 2.1.0
  universal_io: 2.2.2
  persian_number_utility: 1.1.6
  flutter_multi_formatter: 2.13.10
  package_info_plus: 9.0.0
  device_info_plus: 12.1.0
  shimmer: ^3.0.0
  unique_device_identifier: ^2.0.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/logos/
    - assets/imgs/products/
    - assets/imgs/vectors/
    - assets/imgs/banners/
    - assets/icons/
  fonts:
    - family: IranSans
      fonts:
        - asset: assets/fonts/IRANSans(FaNum)_Light.ttf
          weight: 300
        - asset: assets/fonts/IRANSans(FaNum).ttf
          weight: 400
        - asset: assets/fonts/IRANSans(FaNum)_Medium.ttf
          weight: 500
        - asset: assets/fonts/IRANSans(FaNum)_Bold.ttf
          weight: 600
    - family: Yekan
      fonts:
        - asset: assets/fonts/Yekan.ttf
          weight: 400
